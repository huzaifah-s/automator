# Local development only.
#
# Docker Compose loads this automatically for a bare `docker compose up`, and
# ignores it when a file is named explicitly with -f — which is how Coolify
# invokes compose. So the port is published on your machine and not on the
# server, where the proxy handles it.
#
# Change the host side if 3000 is taken: HOST_PORT=3100 docker compose up
services:
  automator:
    ports:
      - "${HOST_PORT:-3000}:3000"
